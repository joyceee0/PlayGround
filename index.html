<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>NEON BLADE // ZERO</title>
  <style>
    :html,body{height:100%;overflow:hidden}*{box-sizing:border-box}html,body{margin:0;background:#08090d;color:#edf5ff;font-family:Impact,"Arial Black",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:auto}
    #ui{position:fixed;inset:0;pointer-events:none}
    .top{position:absolute;top:28px;left:38px;width:min(420px,42vw)}
    #name{font-size:13px;letter-spacing:5px;color:#fff;text-shadow:0 0 12px #dcffff}.bar{height:13px;margin-top:7px;background:rgba(9,13,20,.78);border:1px solid rgba(210,238,255,.18);transform:skewX(-14deg);overflow:hidden}.fill{height:100%;transition:width .12s}#hp{width:100%;background:linear-gradient(90deg,#f13e58,#ffb3c1);box-shadow:0 0 16px #ff416d}
    #stance{margin-top:8px;font:800 10px system-ui;color:#9bdaf0;letter-spacing:3px}.score{position:absolute;right:38px;top:25px;text-align:right}.score small{display:block;font:800 11px system-ui;letter-spacing:4px;color:#8ca4b1}.score #score{font-size:42px;line-height:1;text-shadow:0 0 18px rgba(0,211,255,.45)}
    #combo{position:absolute;right:42px;top:104px;text-align:right;opacity:0;transform:translateY(-8px);transition:.12s}.combo-num{font-size:52px;color:#ffe66d;text-shadow:0 0 18px #ff7a18}.combo-label{font:900 11px system-ui;letter-spacing:4px;color:#fff}
    #boss{position:absolute;left:50%;bottom:28px;width:min(520px,52vw);transform:translateX(-50%);opacity:0}.bossname{font:900 10px system-ui;text-align:center;letter-spacing:5px;margin-bottom:6px;color:#ff7a94}.bossbar{height:8px;background:#151720;border:1px solid #7d2d3b}.bossfill{height:100%;width:100%;background:linear-gradient(90deg,#bd1f38,#ff6b78)}
    #toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) skewX(-8deg);font-size:48px;letter-spacing:8px;text-align:center;text-shadow:0 5px 24px #000;opacity:0}.sub{display:block;margin-top:7px;font:800 11px system-ui;letter-spacing:5px;color:#9de6ff}
    #start,#gameover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,rgba(10,23,32,.3),rgba(4,5,8,.92));pointer-events:auto}.hidden{display:none!important}
    .kicker{font:900 12px system-ui;letter-spacing:8px;color:#69dff5}.title{font-size:clamp(52px,9vw,108px);line-height:.78;text-align:center;letter-spacing:-4px;margin:24px 0;text-shadow:8px 8px 0 #2c1823,0 0 36px rgba(103,227,255,.22)}.title i{display:block;font-style:normal;color:#ff5d77;-webkit-text-stroke:1px #ffc1c9}
    #start button,#gameover button{pointer-events:auto;margin-top:30px;border:1px solid #9cecff;background:rgba(11,31,39,.78);color:#fff;padding:15px 36px;font:900 12px system-ui;letter-spacing:4px;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);cursor:pointer}.controls{margin-top:24px;font:800 10px system-ui;color:#9baeb7;letter-spacing:2px;text-align:center;line-height:2}
    #touch{display:none}.touchbtn{position:absolute;pointer-events:auto;border:1px solid rgba(170,238,255,.25);border-radius:50%;background:rgba(12,25,34,.48);color:#dffaff;font:900 12px system-ui;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
    #dpad{position:absolute;left:20px;bottom:24px;width:150px;height:150px}.d{width:50px;height:50px}.left{left:0;top:50px}.right{right:0;top:50px}.up{left:50px;top:0}.down{left:50px;bottom:0}.attack{right:28px;bottom:34px;width:82px;height:82px;border-color:rgba(255,113,137,.5)}.dash{right:122px;bottom:18px;width:62px;height:62px}.jump{right:44px;bottom:124px;width:64px;height:64px}
    @media(pointer:coarse),(max-width:700px){#touch{display:block}.top{top:14px;left:15px;width:38vw}.score{top:12px;right:15px}.score #score{font-size:27px}#boss{bottom:12px;width:45vw}.controls{display:none}.title{font-size:50px}.title i{display:inline}.top #name{font-size:9px}.score small{font-size:8px}.bar{height:9px}}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top"><div id="name">R・SHADOW // TYPE-0</div><div class="bar"><div id="hp" class="fill"></div></div><div id="stance">PHASE // 01</div></div>
  <div class="score"><small>DATA SCORE</small><div id="score">000000</div></div>
  <div id="combo"><div class="combo-num">×<span id="hits">1</span></div><div class="combo-label">CHAIN</div></div>
  <div id="boss"><div class="bossname">EXECUTIONER // X-47</div><div class="bossbar"><div id="bossfill" class="bossfill"></div></div></div>
  <div id="toast"><span id="toastmain">STAGE 01</span><small class="sub" id="toastsub">THE LOWER DISTRICT</small></div>
  <div id="start"><div class="kicker">OPERATION // VOID CITY</div><div class="title">NEON<i>BLADE</i></div><button id="play">ENTER THE SECTOR</button><div class="controls">A / D MOVE &nbsp;·&nbsp; W JUMP &nbsp;·&nbsp; J LIGHT &nbsp;·&nbsp; K HEAVY &nbsp;·&nbsp; L DASH &nbsp;·&nbsp; P PAUSE</div></div>
  <div id="gameover" class="hidden"><div class="kicker">SYSTEM FAILURE</div><div class="title">SIGNAL<i>LOST</i></div><button id="retry">REINITIALIZE</button></div>
  <div id="touch"><div id="dpad"><div class="touchbtn d left" data-key="a">◀</div><div class="touchbtn d right" data-key="d">▶</div><div class="touchbtn d up" data-key="w">▲</div><div class="touchbtn d down" data-key="s">▼</div></div><div class="touchbtn jump" data-key="w">JUMP</div><div class="touchbtn dash" data-key="l">DASH</div><div class="touchbtn attack" data-key="j">BLADE</div></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};
function keyName(e){return e.key.length===1?e.key.toLowerCase():e.key.toLowerCase()}
addEventListener('keydown',e=>{keys[keyName(e)]=true;if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>{keys[keyName(e)]=false});
const $=id=>document.getElementById(id),hpEl=$('hp'),scoreEl=$('score'),comboEl=$('combo'),hitsEl=$('hits'),bossEl=$('boss'),bossFill=$('bossfill'),toast=$('toast'),toastmain=$('toastmain'),toastsub=$('toastsub'),start=$('start'),gameover=$('gameover');
let state='menu',paused=false,time=0,score=0,shake=0,flash=0,spawnTimer=0,wave=1,enemyLimit=3,boss=null;
const ground=()=>H*.82;let player;
function rnd(a,b){return a+Math.random()*(b-a)}
function newPlayer(){return{x:W*.18,y:ground()-92,vx:0,vy:0,w:48,h:92,hp:100,max:100,facing:1,on:false,attack:0,attackType:'',dash:0,dashCd:0,inv:0,combo:0,comboTimer:0,heavyCd:0}}
let enemies=[],sparks=[],slashes=[],rain=[];
for(let i=0;i<90;i++)rain.push({x:Math.random()*1600,y:Math.random()*900,l:20+Math.random()*50,s:.4+Math.random()*.8,o:.05+Math.random()*.12});
function reset(){player=newPlayer();enemies=[];sparks=[];slashes=[];score=0;wave=1;enemyLimit=3;spawnTimer=1;boss=null;state='play';start.classList.add('hidden');gameover.classList.add('hidden');bossEl.style.opacity=0;showToast('STAGE 01','THE LOWER DISTRICT',170)}
$('play').onclick=reset;$('retry').onclick=reset;
function showToast(a,b,t=120){toastmain.textContent=a;toastsub.textContent=b;toast.style.opacity=1;toast.style.transition='opacity .25s';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.style.opacity=0,t)}
function press(k){return keys[k]||keys[k==='j'?' ':'j']}
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P')paused=!paused});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false});b.addEventListener('pointercancel',()=>keys[k]=false)});
function spawnEnemy(bossType=false){let side=Math.random()<.5?-1:1;if(bossType){boss={x:W*.78,y:ground()-126,vx:0,vy:0,w:76,h:126,hp:900,max:900,facing:-1,type:'boss',attack:0,attackCd:70,hit:0,guard:0};bossEl.style.opacity=1;return}enemies.push({x:side<0?-60:W+60,y:ground()-100,vx:0,vy:0,w:48,h:100,hp:80+(wave*18),max:80+(wave*18),facing:-side,attack:0,attackCd:50+Math.random()*50,hit:0,guard:Math.random()<.24,type:'grunt'})}
function burst(x,y,n=12,col='#7ff3ff'){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*8;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:12+Math.random()*18,col})}}
function update(){if(state!='play'||paused)return;time++;
 let p=player,acc=0;if(keys.a||keys.arrowleft)acc--;if(keys.d||keys.arrowright)acc++;
 p.vx=acc* (p.dash>0?11:4.6);p.facing=acc||p.facing;if(!p.on)p.vy+=.72;if(p.on&&keys.w)p.vy=-12.8,p.on=false;
 if(keys.w||keys.arrowup)p.jumpHeld=true;else p.jumpHeld=false;
 if(p.dashCd>0)p.dashCd--;if((keys.l||keys[' '])&&p.dashCd<=0&&p.dash<=0){p.dash=10;p.dashCd=55;p.inv=12;p.vx=p.facing*15;burst(p.x,p.y-45,8,'#89edff')}
 if(p.dash>0)p.dash--;if(p.inv>0)p.inv--;if(p.attack>0)p.attack--;if(p.hit>0)p.hit--;
 if(p.comboTimer>0)p.comboTimer--;else p.combo=0;
 if(keys.j&&p.attack<=0){p.attack=18;p.attackType='light';p.comboTimer=80;slash(p,80,34)}
 if(keys.k&&p.attack<=0&&p.heavyCd<=0){p.attack=30;p.attackType='heavy';p.heavyCd=45;p.comboTimer=100;slash(p,128,52)}
 if(p.heavyCd>0)p.heavyCd--;
 p.x+=p.vx;p.y+=p.vy;if(p.y+p.h>=ground()){p.y=ground()-p.h;p.vy=0;p.on=true}else p.on=false;p.x=Math.max(24,Math.min(W-24-p.w,p.x));
 spawnTimer--;if(!boss&&enemies.length<enemyLimit&&spawnTimer<=0){spawnEnemy();spawnTimer=55-Math.min(wave*6,35)+Math.random()*50}
 if(wave>=4&&!boss&&enemies.length===0&&spawnTimer<0){spawnEnemy(true);showToast('THREAT ALERT','EXECUTIONER // X-47',180)}
 let list=enemies.slice();if(boss)list.push(boss);
 for(let e of list){if(e.hit>0)e.hit--;e.attackCd--;if(e.attack>0)e.attack--;
  let dx=p.x-e.x;let dist=Math.abs(dx);e.facing=dx<0?-1:1;
  if(e.type==='boss'){let speed=dist>190?2.2:1.1;e.x+=e.facing*(dist>90?speed:0);if(dist<190&&e.attackCd<=0&&e.attack<=0){e.attackCd=80-Math.min(wave*4,30);e.attack=24} }
  else{if(dist>58)e.x+=e.facing* (1.15+wave*.12);if(dist<82&&e.attackCd<=0&&e.attack<=0){e.attack=e.type==='boss'?30:22;e.attackCd=58-Math.random()*20}}
  if(p.attack>0&&p.attack>(p.attackType==='heavy'?8:10)){let reach=p.attackType==='heavy'?132:92,hitx=p.x+p.w/2+p.facing*45;if(Math.abs(hitx-e.x-e.w/2)<reach/2+e.w/2&&Math.abs(p.y-e.y)<e.h){let dmg=p.attackType==='heavy'?32:19;if(e.attackHit!==p.attack){e.hp-=dmg;e.attackHit=p.attack;burst(hitx,p.y-35,p.attackType==='heavy'?22:12,e.hit>0?'#ffcf72':'#7ff3ff');e.hit=12;e.x+=p.facing* (p.attackType==='heavy'?18:7);p.combo++;p.comboTimer=85;score+=dmg*10*p.combo;shake=p.attackType==='heavy'?12:6}}}
  if(e.attack>10&&dist<100&&Math.abs(p.y-e.y)<100&&p.inv<=0&&p.attack<=0){p.hp-=e.type==='boss'?18:9;p.inv=38;shake=12;burst(p.x+p.w/2,p.y-45,16,'#ff5577');p.vx=-e.facing*7}
 }
 enemies=enemies.filter(e=>{if(e.hp<=0){score+=500;burst(e.x,e.w?e.y-40:e.y,20,'#ff6b8c');p.combo++;p.comboTimer=90;return false}return true});
 if(boss&&boss.hp<=0){score+=5000;burst(boss.x,boss.y-60,50,'#ffd166');boss=null;bossEl.style.opacity=0;wave++;showToast('SECTOR CLEARED','THE VOID AWAKENS',220);setTimeout(()=>{if(state==='play'){wave++;enemyLimit+=2;spawnTimer=90;showToast('STAGE 02','NEON RUINS',180)}},260)}
 if(enemies.length===0&&!boss&&spawnTimer<0){let now=Math.floor(time/1000);if(wave<4&&time%1200<2){wave++;enemyLimit+=2;spawnTimer=120;showToast('WAVE '+String(wave).padStart(2,'0'),'HOSTILES INBOUND',150)}}
 if(p.hp<=0){state='over';gameover.classList.remove('hidden');keys.j=keys.k=keys.l=false}
 hpEl.style.width=Math.max(0,p.hp/p.max*100)+'%';scoreEl.textContent=String(score).padStart(6,'0');hitsEl.textContent=p.combo||1;comboEl.style.opacity=p.combo>1?1:0;comboEl.style.transform=p.combo>1?'translateY(0) scale(1)':'translateY(-8px)';if(boss)bossFill.style.width=Math.max(0,boss.hp/boss.max*100)+'%';if(shake>0)shake--;
}
function slash(p,reach,h){slashes.push({x:p.x+p.w/2+p.facing*reach*.45,y:p.y-p.h*.15,f:p.facing,l:18,reach,h,type:p.attackType})}
function draw(){
 x.fillStyle='#070910';x.fillRect(0,0,W,H);
 let horizon=H*.61;let sky=x.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#090d18');sky.addColorStop(.65,'#101627');sky.addColorStop(1,'#20243a');x.fillStyle=sky;x.fillRect(0,0,W,horizon);
 // distant city
 for(let i=0;i<18;i++){let bw=70+((i*37)%55),bx=((i*137-W*.12)% (W+180))-90,by=170+(i%4)*22,h=120+(i*53)%190;x.fillStyle=i%3?'#111425':'#17182a';x.fillRect(bx,horizon-h-bw*.1,bw,h);x.fillStyle=i%2?'#2b3150':'#1e3a4a';for(let yy=horizon-h+18;yy<horizon-12;yy+=18)for(let xx=bx+10;xx<bx+bw-5;xx+=15)if((xx+yy+i)%3<2)x.fillRect(xx,yy,4,7)}
 x.strokeStyle='rgba(103,203,230,.12)';for(let i=0;i<8;i++){let y=horizon+i*i*3;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}for(let i=-8;i<12;i++){x.beginPath();x.moveTo(W/2,horizon);x.lineTo(W/2+i*W*.13,H);x.stroke()}
 // rain
 x.lineWidth=1;for(let r of rain){r.x-=r.s*2;r.y+=r.s*9;if(r.y>H){r.y=-30;r.x=Math.random()*W}x.strokeStyle=`rgba(150,220,255,${r.o})`;x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x-8*r.s,r.y-r.l);x.stroke()}
 // floor
 let fl=x.createLinearGradient(0,ground(),0,H);fl.addColorStop(0,'#242a38');fl.addColorStop(.7,'#10131d');fl.addColorStop(1,'#080910');x.fillStyle=fl;x.fillRect(0,ground(),W,H-ground());x.fillStyle='#667da0';x.globalAlpha=.25;x.fillRect(0,ground(),W,2);x.globalAlpha=1;
 for(let i=0;i<22;i++){let y=ground()+20+i*i*1.7;x.strokeStyle='rgba(127,171,203,.09)';x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
 let sx=shake>0?(Math.random-.5)*shake:0,sy=shake>0?(Math.random-.5)*shake:0;x.save();x.translate(sx,sy);
 // enemies
 for(let e of enemies)drawFighter(e,false);if(boss)drawFighter(boss,true);drawFighter(player,true);
 // slashes
 slashes=slashes.filter(s=>{s.l--;x.save();x.translate(s.x,s.y);x.scale(s.f,1);x.globalAlpha=Math.max(0,s.l/18);x.strokeStyle=s.type==='heavy'?'#fff09d':'#aefcff';x.lineWidth=s.type==='heavy'?9:5;x.beginPath();x.arc(0,0,s.reach*.62,-1.1,1.1);x.stroke();x.restore();return s.l>0});
 // sparks
 sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.18;s.l--;x.globalAlpha=Math.min(1,s.l/12);x.fillStyle=s.col;x.fillRect(s.x,s.y,3,3);x.globalAlpha=1;return s.l>0});
 x.restore();
 if(paused){x.fillStyle='rgba(4,6,10,.72)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='900 48px Impact';x.textAlign='center';x.fillText('PAUSED',W/2,H/2)}
}
function drawFighter(p,hero){let cx=p.x+p.w/2,base=p.y+p.h;let dir=p.facing||1;
 x.save();x.translate(cx,base);x.scale(dir,1);x.translate(-p.w/2,-p.h);
 x.globalAlpha=p.inv>0&&(Math.floor(p.inv/3)%2)?.35:1;
 // shadow
 x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(p.w/2,p.h+5,p.w*.75,10,0,0,Math.PI*2);x.fill();
 if(p.hit>0)x.globalAlpha=.65;
 if(hero){let bob=Math.sin(time*.16)*2;x.translate(0,bob);x.fillStyle='#121b27';x.beginPath();x.moveTo(8,12);x.lineTo(38,4);x.lineTo(43,46);x.lineTo(35,76);x.lineTo(19,76);x.lineTo(11,43);x.fill();x.fillStyle='#dceaf2';x.fillRect(12,22,31,7);x.fillStyle='#ff5272';x.fillRect(33,18,6,25);x.fillStyle='#b8c9d6';x.beginPath();x.arc(27,6,10,0,7);x.fill();x.fillStyle='#18212c';x.fillRect(22,2,18,5);x.fillStyle='#0b1017';x.fillRect(8,70,16,22);x.fillRect(30,70,16,22);x.fillStyle='#93efff';x.fillRect(8,70,16,3);x.fillRect(30,70,16,3);
  if(p.attack>0){let a=p.attackType==='heavy'?1.4:.95;x.save();x.translate(38,36);x.rotate(-.7+a*Math.sin(p.attack*.3));x.fillStyle='#eafcff';x.fillRect(0,-3,72,5);x.fillStyle='#82e9ff';x.fillRect(58,-8,12,14);x.restore()}
 }else{let bossy=p.type==='boss';x.fillStyle=bossy?'#3a1822':'#232638';x.beginPath();x.moveTo(9,20);x.lineTo(32,8);x.lineTo(48,24);x.lineTo(42,82);x.lineTo(20,82);x.fill();x.fillStyle=bossy?'#9c3047':'#59677a';x.fillRect(16,28,28,10);x.fillStyle=bossy?'#ff6d82':'#9eb7ca';x.fillRect(19,7,28,14);x.fillStyle='#11131b';x.fillRect(28,10,19,5);x.fillStyle='#ff5872';x.fillRect(35,11,9,3);x.fillStyle='#151823';x.fillRect(7,76,17,bossy?28:24);x.fillRect(33,76,17,bossy?28:24);x.fillStyle='#6e1d31';if(p.attack>0){x.save();x.translate(38,38);x.rotate(-.8);x.fillRect(0,-5,62,10);x.restore()}}
 x.restore();x.globalAlpha=1;
}
function loop(){update();draw();requestAnimationFrame(loop)}reset();state='menu';start.classList.remove('hidden');loop();
</script>
</body>
</html>
